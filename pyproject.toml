[project]
name = "nanobanana"
version = "0.1.0"
description = "Single-file Gemini Image CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1,<2",
    "pillow>=11,<12",
    "typer>=0.16,<1",
    "rich>=14,<15",
]

[project.scripts]
nanobanana = "nanobanana.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanobanana"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "RUF", "SIM"]
